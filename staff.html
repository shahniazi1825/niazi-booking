<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Front desk — Clinic</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/assets/staff.css">
</head>
<body>
<div class="wrap wide">
<header class="top">
  <div><h1 data-clinic-name>Front desk</h1><p id="who">Staff sign-in</p></div>
  <nav id="nav" hidden>
    <select id="clinicSwitch" aria-label="Clinic" hidden></select>
    <a href="/insights.html" id="insightsLink" hidden>Insights</a>
    <a href="#" id="logout">Sign out</a>
  </nav>
</header>
<main class="card" aria-live="polite">

<!-- Sign in -->
<section id="login" class="v step on">
  <h2>Staff sign-in</h2>
  <form id="loginForm" novalidate>
    <label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username" required>
    <label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password" required>
    <button id="lBtn" type="submit">Sign in</button>
  </form>
  <p id="lMsg" class="msg"></p>
</section>

<!-- Signed in -->
<section id="app" class="v step">
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="today" class="tab on">Today</button>
    <button type="button" role="tab" data-tab="book" class="tab writer">Book</button>
    <button type="button" role="tab" data-tab="patients" class="tab writer">Patients</button>
  </div>

  <div id="t-today" class="pane on">
    <div class="row tight"><div><label for="dDate">Day</label><input id="dDate" type="date"></div><div><label>&nbsp;</label><button id="dRefresh" type="button" class="ghost">Refresh</button></div></div>
    <div id="alerts"></div>
    <div id="kpis" class="kpis"></div>
    <h3>Appointments</h3>
    <div id="appts"></div>
    <h3>Call-backs &amp; tasks</h3>
    <div id="tasks"></div>
    <p id="dMsg" class="msg"></p>
  </div>

  <div id="t-book" class="pane">
    <label for="bService">Treatment</label><select id="bService"></select>
    <label for="bDoctor">Doctor</label><select id="bDoctor"><option value="">Any available doctor</option></select>
    <label for="bDate">Date</label><input id="bDate" type="date">
    <button id="bFind" type="button">Show free times</button>
    <p id="bMsg" class="msg"></p>
    <div id="bSlots" class="slots"></div>
    <div id="bOverride" class="manager" hidden>
      <label class="inline"><input id="oOn" type="checkbox"> <span>Manager override: book a time outside the normal rules</span></label>
      <div id="oFields" hidden>
        <label for="oWhen">Date and time (clinic time)</label><input id="oWhen" type="datetime-local">
        <label for="oReason">Reason (saved in the history)</label><input id="oReason" maxlength="300">
        <button id="oUse" type="button" class="ghost">Use this time</button>
      </div>
    </div>
    <form id="bForm" hidden novalidate>
      <div class="sum" id="bSummary"></div>
      <label for="bName">Patient full name</label><input id="bName" autocomplete="off">
      <label for="bPhone">Mobile number</label><input id="bPhone" type="tel" autocomplete="off" placeholder="+1 868 555 0100">
      <label for="bEmail">Email (optional)</label><input id="bEmail" type="email" autocomplete="off">
      <button id="bBook" type="submit">Book appointment</button>
      <p id="bOut" class="msg"></p>
    </form>
  </div>

  <div id="t-patients" class="pane">
    <form id="pSearch" class="row tight" novalidate>
      <div><label for="pQ">Name, phone or email</label><input id="pQ" minlength="3"></div>
      <div><label>&nbsp;</label><button type="submit">Search</button></div>
    </form>
    <p id="pMsg" class="msg"></p>
    <div id="pResults"></div>
  </div>
</section>

<!-- Modal for history / confirmations -->
<dialog id="dlg"><div id="dlgBody"></div><button type="button" class="ghost" id="dlgClose">Close</button></dialog>

</main>
<footer>Staff only. Every change is recorded with your name.</footer>
</div>
<script src="/assets/config.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/staff.js"></script>
</body>
</html>
