<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>An earlier appointment is available — Clinic</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="wrap">
<header class="top"><div><h1 data-clinic-name>Our clinic</h1><p>Waiting list</p></div></header>
<main class="card" aria-live="polite">
  <section id="o1" class="o step on">
    <h2>An earlier time is available</h2>
    <p class="hint" id="offerWhen">A time you were waiting for has become free. Offers last 15 minutes and go to the first person who accepts.</p>
    <button id="accept" type="button">Accept this appointment</button>
    <p id="oMsg" class="msg"></p>
  </section>
  <section id="o2" class="o step">
    <h2>You're booked</h2>
    <div class="msg ok">The appointment is confirmed. We'll send you a reminder.</div>
    <div class="sum" id="oSummary"></div>
    <button type="button" class="ghost" data-href="/manage.html">Change or cancel</button>
  </section>
</main>
<footer>Need help? Call <span data-clinic-phone>the clinic</span>.</footer>
</div>
<script src="/assets/config.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/offer.js"></script>
</body>
</html>
